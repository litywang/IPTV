name: IPTV Daily Check

on:
  schedule:
    # 每天 02:00 UTC (北京时间 10:00)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  iptv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Restore iptv cache
        uses: actions/cache@v4
        with:
          path: |
            .iptv_cache.json
            .iptv_stats.json
          key: iptv-data-${{ github.run_id }}
          restore-keys: iptv-data-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run IPTV crawler
        run: |
          python run_iptv.py -w 60 -t 10 --no-speed-check 2>&1 | tee check.log
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TQDM_DISABLE: 1

      - name: Generate M3U
        run: |
          python scripts/generate_m3u.py
          # Ensure at least one channel was generated; otherwise fail the workflow
          if [ -s live_ok.m3u ]; then echo "M3U generated"; else echo "M3U empty – likely all streams filtered"; exit 1; fi
        if: success()

      - name: Sanitize and sync to Gist
        run: python scripts/sync_to_gist.py
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        if: success()

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/litywang/IPTV.git
          git add live_ok_git.txt live_ok.m3u .iptv_cache.json .iptv_stats.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            count=$(grep -c ',http' live_ok_git.txt 2>/dev/null || echo 0)
            git commit -m "chore: auto-update $(date +%Y-%m-%d) sources=${count}"
            git pull --rebase origin master || true
            git push origin master
          else
            echo "No changes to commit"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-logs-${{ github.run_number }}
          path: check.log
          retention-days: 7
          if-no-files-found: ignore
